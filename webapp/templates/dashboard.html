<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CryptoBank — Tài khoản</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="topbar">
    <div class="brand">CryptoBank</div>
    <div class="nav">
      <span>{{ user.user }} <span class="badge {{ user.role }}">{{ user.role }}</span></span>
      <a href="/monitor">Số dư</a>
      <a href="/explorer">Giao dịch</a>
      <a href="/reset" onclick="return confirm('Khôi phục toàn bộ số dư về ban đầu?')">Reset</a>
      <a href="/logout">Đăng xuất</a>
    </div>
  </div>

  <div class="wrap">
    <div class="grid">
      <div class="card">
        <h2>Số dư khả dụng</h2>
        <div class="balance" id="balance">…<small>{{ currency }}</small></div>
      </div>
      <div class="card">
        <h2>Chuyển tiền</h2>
        <form id="xferForm">
          <label>Người nhận</label>
          <input id="to" list="users" placeholder="vd: bob" required>
          <datalist id="users">
            <option value="alice"><option value="bob"><option value="carlos"><option value="admin">
          </datalist>
          <label>Số tiền ({{ currency }})</label>
          <input id="amount" type="number" min="1" required>
          <button type="submit" style="width:100%">Ký &amp; Gửi</button>
        </form>
        <div id="xferMsg"></div>
      </div>
    </div>

    {% if user.role == 'admin' %}
    <div class="card">
      <h2>Quản trị — Danh sách tài khoản</h2>
      <div id="adminBox" class="muted">Đang tải…</div>
    </div>
    {% endif %}

    <div class="card">
      <h2>Giao dịch gần đây</h2>
      <table>
        <thead><tr><th>#</th><th>Từ</th><th>Đến</th><th class="num">Số tiền</th></tr></thead>
        <tbody id="hist"></tbody>
      </table>
    </div>
  </div>

  <script>
    const CUR = "{{ currency }}";
    const fmt = n => Number(n).toLocaleString('vi-VN');

    // ECDSA trong trình duyệt — tham số (P, N, A, G) nạp động theo đường cong của ví.
    let P = 0n, N = 0n, A = 0n, G = null;
    function setCurve(c) {
      P = BigInt(c.p); N = BigInt(c.n); A = BigInt(c.a);
      G = { x: BigInt(c.Gx), y: BigInt(c.Gy) };
    }
    const mod = (a, m) => ((a % m) + m) % m;
    function inv(a, m) {
      a = mod(a, m); let [or_, r] = [a, m], [os, s] = [1n, 0n];
      while (r) { const q = or_ / r; [or_, r] = [r, or_ - q * r]; [os, s] = [s, os - q * s]; }
      return mod(os, m);
    }
    function add(Pt, Qt) {
      if (!Pt) return Qt; if (!Qt) return Pt;
      if (Pt.x === Qt.x && mod(Pt.y + Qt.y, P) === 0n) return null;
      let m;
      if (Pt.x === Qt.x && Pt.y === Qt.y) m = mod((3n * Pt.x * Pt.x + A) * inv(2n * Pt.y, P), P);
      else m = mod((Qt.y - Pt.y) * inv(mod(Qt.x - Pt.x, P), P), P);
      const x3 = mod(m * m - Pt.x - Qt.x, P);
      return { x: x3, y: mod(m * (Pt.x - x3) - Pt.y, P) };
    }
    function mul(k, Pt) {
      let R = null, Q = Pt; k = mod(k, N);
      while (k > 0n) { if (k & 1n) R = add(R, Q); Q = add(Q, Q); k >>= 1n; }
      return R;
    }
    const bitLen = x => x === 0n ? 0 : x.toString(2).length;
    // z = H(m): cắt bit cho khớp _hash_to_int phía server (bắt buộc để verify khớp)
    async function hashInt(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      let h = '0x'; for (const b of new Uint8Array(buf)) h += b.toString(16).padStart(2, '0');
      let e = BigInt(h);
      const excess = bitLen(e) - bitLen(N);
      if (excess > 0) e >>= BigInt(excess);
      return mod(e, N);
    }
    function randScalar() {
      const b = new Uint8Array(32); crypto.getRandomValues(b);
      let h = '0x'; for (const x of b) h += x.toString(16).padStart(2, '0');
      return mod(BigInt(h), N - 1n) + 1n;
    }
    async function signTx(d, msg) {
      const z = mod(await hashInt(msg), N);
      while (true) {
        const k = randScalar();
        const R = mul(k, G); const r = mod(R.x, N); if (r === 0n) continue;
        const s = mod(inv(k, N) * (z + r * d), N); if (s === 0n) continue;
        return { r, s };
      }
    }
    // chuẩn hóa GIỐNG HỆT bank.tx_bytes (khóa sắp xếp: amount, from, id, to)
    const txBytes = tx => `{"amount":${tx.amount},"from":"${tx.from}","id":${tx.id},"to":"${tx.to}"}`;

    let WALLET = null;
    async function loadWallet() {
      const r = await fetch('/api/wallet');
      if (r.status === 401) { window.location = '/login'; return; }
      WALLET = await r.json();
      setCurve(WALLET.curve);
    }
    async function loadAccount() {
      const r = await fetch('/api/account');
      if (r.status === 401) { window.location = '/login'; return; }
      const a = await r.json();
      document.getElementById('balance').innerHTML = fmt(a.balance) + '<small>' + CUR + '</small>';
      document.getElementById('hist').innerHTML = a.history.slice().reverse().map(t =>
        `<tr><td>${t.id}</td><td>${t.from}</td><td>${t.to}</td><td class="num">${fmt(t.amount)}</td></tr>`
      ).join('') || '<tr><td colspan="4" class="muted">Chưa có giao dịch</td></tr>';
    }
    document.getElementById('xferForm').onsubmit = async (e) => {
      e.preventDefault();
      const box = document.getElementById('xferMsg');
      if (!WALLET) { box.className = 'msg err'; box.textContent = 'Ví chưa nạp xong'; return; }
      box.className = 'msg'; box.textContent = 'Đang ký giao dịch trong trình duyệt…';
      const acc = await (await fetch('/api/account')).json();   // lấy số thứ tự giao dịch từ server
      const tx = {
        id: acc.next_id,
        from: WALLET.user,
        to: document.getElementById('to').value,
        amount: parseInt(document.getElementById('amount').value, 10),
      };
      const { r, s } = await signTx(BigInt(WALLET.d), txBytes(tx));
      const res = await (await fetch('/api/tx/submit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...tx, r: r.toString(), s: s.toString() })
      })).json();
      box.className = 'msg ' + (res.ok ? 'ok' : 'err');
      box.textContent = res.message;
      if (res.ok) { loadAccount(); document.getElementById('xferForm').reset(); }
    };
    async function loadAdmin() {
      const box = document.getElementById('adminBox');
      if (!box) return;                       // chỉ admin mới có phần này
      const r = await fetch('/api/admin/users');
      if (r.status !== 200) { box.className = 'msg err'; box.textContent = 'Bị từ chối'; return; }
      const d = await r.json();
      box.className = '';
      box.innerHTML = '<table><thead><tr><th>Tài khoản</th><th>Họ tên</th><th>Vai trò</th>'
        + '<th class="num">Số dư</th></tr></thead><tbody>'
        + d.accounts.map(a => `<tr><td>${a.user}</td><td>${a.name || ''}</td>`
            + `<td>${a.role}</td><td class="num">${fmt(a.balance)}</td></tr>`).join('')
        + '</tbody></table>';
    }
    loadWallet();
    loadAccount();
    loadAdmin();
  </script>
</body>
</html>
